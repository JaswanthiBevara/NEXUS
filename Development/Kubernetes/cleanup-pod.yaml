
apiVersion: v1
kind: Pod
metadata:
  name: nexus-cleanup
  namespace: streaming
spec:
  restartPolicy: Never
  containers:
    - name: cleanup
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: checkpoint
          mountPath: /data/checkpoint
        - name: delta
          mountPath: /data/delta
  volumes:
    - name: checkpoint
      persistentVolumeClaim:
        claimName: nexus-consumer-checkpoint
    - name: delta
      persistentVolumeClaim:
        claimName: nexus-streaming-data
