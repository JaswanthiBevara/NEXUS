
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-incoming-data
  namespace: streaming
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  resources:
    requests:
      storage: 1Gi
