apiVersion: v1
kind: Pod
metadata:
  name: nexus-data-transfer
  namespace: streaming
spec:
  containers:
    - name: transfer
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /data/incoming && sleep 36000"]
      volumeMounts:
        - name: incoming-storage
          mountPath: /data/incoming
  volumes:
    - name: incoming-storage
      persistentVolumeClaim:
        claimName: nexus-incoming-data
  restartPolicy: Never