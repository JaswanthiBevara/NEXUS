apiVersion: v1
kind: Pod
metadata:
  name: nexus-delta-inspector
  namespace: streaming

spec:
  restartPolicy: Never

  securityContext:
    fsGroup: 185

  containers:
    - name: inspector
      image: nexus-order-consumer:1.1
      imagePullPolicy: IfNotPresent

      command:
        - sh
        - -c
        - sleep 3600

      volumeMounts:
        - name: streaming-data
          mountPath: /data/delta

  volumes:
    - name: streaming-data
      persistentVolumeClaim:
        claimName: nexus-streaming-data